[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nssim"
version = "0.1.0"
description = "Hardware-in-the-loop test harness for Northstar-CV auto-aim, built on the TR ARCTIC 2026 simulator"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy<2",
    "opencv-python",
    "pyyaml",
    "dacite",
    "aiohttp>=3.9",  # the dashboard's web server
]

[project.optional-dependencies]
# The renderer (SAPIEN, through Vulkan). ManiSkill isn't needed: the harness builds its own scene.
sim = [
    "sapien==3.0.3",
]
viz = [
    "foxglove-sdk",
    "mcap",
]
dev = [
    "pytest",
]

[project.scripts]
nssim = "nssim.cli:main"

[tool.setuptools.packages.find]
include = ["nssim*"]

[tool.setuptools.package-data]
"nssim.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs Docker and the northstar-cv:jetpack7 image (Linux-only C++ conformance tests)",
    "sim: needs SAPIEN and a Vulkan device",
]
