<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nssim dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">nssim<span id="run-name"></span></div>
  <div id="conn" class="pill">connecting…</div>
  <div class="stats">
    <div><span class="k">sim</span><span class="v" id="s-time">–</span></div>
    <div><span class="k">real time</span><span class="v" id="s-rtf">–</span></div>
    <div><span class="k">camera</span><span class="v" id="s-fps">–</span></div>
    <div><span class="k">CV</span><span class="v" id="s-cv">–</span></div>
    <div><span class="k">frame → aim</span><span class="v" id="s-aim">–</span></div>
  </div>
  <div class="time-controls">
    <button id="live-btn" class="live" title="Follow the newest data, or hold the view">● Live</button>
    <label title="How much time the graphs show when live, e.g. 30s, 2m, 1.5h">window
      <input id="window-input" value="30 s" size="6" spellcheck="false"></label>
    <span id="range-box" hidden>
      <label>from <input id="range-from" type="number" step="any"></label>
      <label>to <input id="range-to" type="number" step="any"></label> s
    </span>
  </div>
</header>

<nav id="tabs" class="tabs"></nav>
<div class="hint">Drag across a graph to zoom in · Shift+drag to pan · Ctrl+scroll or pinch to zoom · double-click for live</div>

<main id="grid">
  <section class="panel builtin">
    <h2>Tracking</h2>
    <dl class="values" id="tracking"></dl>
  </section>

  <section class="panel builtin">
    <h2>UART · MCB → CV</h2>
    <table>
      <thead><tr><th>message</th><th class="num">rate</th><th class="num">count</th><th>latest</th></tr></thead>
      <tbody id="t-mcb_to_cv"><tr><td colspan="4" class="empty">nothing yet</td></tr></tbody>
    </table>
  </section>

  <section class="panel builtin">
    <h2>UART · CV → MCB</h2>
    <table>
      <thead><tr><th>message</th><th class="num">rate</th><th class="num">count</th><th>latest</th></tr></thead>
      <tbody id="t-cv_to_mcb"><tr><td colspan="4" class="empty">nothing yet</td></tr></tbody>
    </table>
  </section>

  <div id="graphs"></div>
  <button id="add-graph" class="panel add">+ Add graph</button>

  <section class="panel wide builtin">
    <h2>Messages</h2>
    <div class="log-controls" id="log-filters"></div>
    <div id="log"></div>
  </section>
</main>

<datalist id="signal-list"></datalist>

<script src="/static/plot.js"></script>
<script src="/static/signals.js"></script>
<script src="/static/layout.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
